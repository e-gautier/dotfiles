---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: instance
    image: fedora:44
    pre_build_image: true
    command: sleep infinity
provisioner:
  name: ansible
  options:
    tags: dotfiles,fonts
  env:
    ANSIBLE_ROLES_PATH: "../../roles"
    ANSIBLE_CONFIG: "../../ansible.cfg"
    ANSIBLE_PLAYBOOK_DIR: "../.."
verifier:
  name: ansible

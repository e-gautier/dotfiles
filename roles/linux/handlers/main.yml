---
- name: Install Nerdfonts
  ansible.builtin.command: ~/.nerdfonts/install.sh
  changed_when: true
- name: Restart nftables
  become: true
  ansible.builtin.systemd:
    name: nftables
    state: restarted
- name: Restart resolved
  become: true
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted

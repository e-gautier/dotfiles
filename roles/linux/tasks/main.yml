---
- name: Run requirements
  ansible.builtin.import_tasks: requirements.yml
- name: Add RPM keys
  become: true
  ansible.builtin.rpm_key:
    key: "{{ item }}"
  loop: "{{ rpm_keys }}"
  tags:
    - repos
    - rpm-keys
- name: Install dnf repos
  become: true
  ansible.builtin.dnf:
    name: "{{ item }}"
  loop: "{{ dnf.repos }}"
  tags:
    - repos
    - dnf-repos
- name: Install Microsoft repo
  become: true
  ansible.builtin.get_url:
    url: https://packages.microsoft.com/config/rhel/10/prod.repo
    dest: /etc/yum.repos.d/microsoft.repo
    mode: "0644"
    force: true
  tags:
    - repos
    - microsoft-repo
- name: Upower config
  become: true
  ansible.builtin.copy:
    content: |
      [UPower]
      EnableWattsUpPro=false
      NoPollBatteries=false
      IgnoreLid=false
      UsePercentageForPolicy=true
      PercentageLow=20.0
      PercentageCritical=10.0
      PercentageAction=5.0
      TimeLow=1200
      TimeCritical=300
      TimeAction=120
      AllowRiskyCriticalPowerAction=false
      CriticalPowerAction=HybridSleep
    dest: /etc/UPower/UPower.conf
  tags:
    - system
    - upower
- name: Install VSCodium repo
  become: true
  ansible.builtin.copy:
    content: |
      [gitlab.com_paulcarroty_vscodium_repo]
      name=gitlab.com_paulcarroty_vscodium_repo
      baseurl=https://paulcarroty.gitlab.io/vscodium-deb-rpm-repo/rpms/
      enabled=1
      gpgcheck=1
      repo_gpgcheck=1
      gpgkey=https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/raw/master/pub.gpg
    dest: /etc/yum.repos.d/vscodium.repo
  tags:
    - repos
    - vscodium-repo
- name: Setup Google Cloud CLI
  ansible.builtin.import_tasks: google-cloud-cli.yml
  become: true
  tags:
    - repos
    - packages
    - google-cloud-cli
- name: Setup GitHub CLI
  ansible.builtin.import_tasks: github-cli.yml
  become: true
  tags:
    - repos
    - packages
    - github-cli
- name: Setup logind configuration
  become: true
  tags:
    - system
    - logind
  block:
    - name: Create logind drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/logind.conf.d
        state: directory
        mode: "0755"
    - name: Pin logind defaults
      ansible.builtin.copy:
        dest: /etc/systemd/logind.conf.d/power.conf
        content: |
          [Login]
          HandlePowerKey=poweroff
          HandleSuspendKey=suspend
          HandleHibernateKey=hibernate
          HandleLidSwitch=suspend
          HandleLidSwitchExternalPower=suspend
          HandleLidSwitchDocked=ignore
        mode: "0644"
- name: Setup DNS configuration
  ansible.builtin.import_tasks: dns.yml
  become: true
  tags:
    - system
    - dns
- name: Setup Docker
  ansible.builtin.import_tasks: docker.yml
  become: true
  tags: docker
- name: Setup Vagrant
  ansible.builtin.import_tasks: vagrant.yml
  become: true
  tags: vagrant
- name: Setup security updates
  ansible.builtin.import_tasks: security-updates.yml
  become: true
  tags:
    - system
    - security-updates
- name: Install core packages
  become: true
  ansible.builtin.package:
    name: "{{ packages.core }}"
    state: present
  tags:
    - packages
    - dnf
    - packages-core
- name: Install dev packages
  become: true
  ansible.builtin.package:
    name: "{{ packages.dev }}"
    state: present
  tags:
    - packages
    - dnf
    - packages-dev
- name: Install ui packages
  become: true
  ansible.builtin.package:
    name: "{{ packages.ui }}"
    state: present
  tags:
    - packages
    - dnf
    - packages-ui
- name: Install apps packages
  become: true
  ansible.builtin.package:
    name: "{{ packages.apps }}"
    state: present
  tags:
    - packages
    - dnf
    - packages-apps
- name: Install misc packages
  become: true
  ansible.builtin.package:
    name: "{{ packages.misc }}"
    state: present
  tags:
    - packages
    - dnf
    - packages-misc
- name: Setup mise
  ansible.builtin.import_tasks: mise.yml
  tags:
    - packages
    - pip
    - npm
    - mise
- name: Install Pip packages
  ansible.builtin.command: mise exec -- pip install {{ pip | join(' ') }}
  environment:
    MISE_GLOBAL_CONFIG_FILE: "{{ role_path }}/files/mise/config.toml"
  register: linux_output
  changed_when: "'Successfully installed' in linux_output.stdout"
  tags:
    - packages
    - pip
- name: Setup Nix
  ansible.builtin.import_tasks: nix.yml
  tags:
    - packages
    - nix
- name: Install npm packages
  ansible.builtin.shell:
    cmd: mise exec -- npm ls -g --depth=0 "{{ item }}" >/dev/null && echo present || mise exec -- npm install -g "{{ item }}"
  environment:
    MISE_GLOBAL_CONFIG_FILE: "{{ role_path }}/files/mise/config.toml"
  loop: "{{ npm }}"
  register: linux_output
  changed_when: "'present' not in linux_output.stdout"
  tags:
    - packages
    - npm
- name: Setup Antigravity CLI
  ansible.builtin.import_tasks: agy.yml
  tags:
    - packages
    - agy
- name: Setup Homebrew
  ansible.builtin.import_tasks: homebrew.yml
  tags:
    - packages
    - homebrew
- name: Upgrade Homebrew packages
  community.general.homebrew:
    update_homebrew: true
    upgrade_all: true
  tags:
    - never
    - upgrade
- name: Install Cargo packages
  community.general.cargo:
    name: "{{ cargo }}"
  tags:
    - packages
    - cargo
- name: Setup Flatpak
  ansible.builtin.import_tasks: flatpak.yml
  ignore_errors: true
  tags:
    - packages
    - flatpak
- name: Setup symlinks
  ansible.builtin.import_tasks: symlinks.yml
  tags:
    - dotfiles
    - symlinks
- name: Create vim undodir
  ansible.builtin.file:
    path: ~/.vim/undodir
    state: directory
  tags:
    - dotfiles
    - vim
- name: Setup nftables
  ansible.builtin.import_tasks: nftables.yml
  become: true
  tags:
    - system
    - nftables
- name: Setup Nerdfonts
  ansible.builtin.import_tasks: nerd-fonts.yml
  tags:
    - fonts
    - nerdfonts
- name: List VSCode extensions
  ansible.builtin.command: codium --list-extensions
  register: linux_codium_extensions
  changed_when: false
  failed_when: false # codium not installed
  check_mode: false
  tags: vscodium
- name: Install VSCode extensions
  ansible.builtin.command: codium --install-extension {{ item }}
  loop: "{{ vscodium_extensions }}"
  when:
    - linux_codium_extensions.rc == 0
    - item | lower not in linux_codium_extensions.stdout | lower
  changed_when: true
  tags: vscodium
- name: Download VSCode extensions VSIX
  ansible.builtin.get_url:
    url: "https://marketplace.visualstudio.com/_apis/public/gallery/publishers/{{ item.split('.')[0] }}/vsextensions/{{ item.split('.')[1] }}/latest/vspackage"
    dest: /tmp/{{ item }}.vsix
    mode: "0644"
  check_mode: false # marketplace rejects HEAD
  loop: "{{ vscodium_vsix }}"
  when:
    - linux_codium_extensions.rc == 0
    - item | lower not in linux_codium_extensions.stdout | lower
  tags: vscodium
- name: Install VSCode extensions VSIX
  ansible.builtin.command: codium --install-extension /tmp/{{ item }}.vsix
  loop: "{{ vscodium_vsix }}"
  when:
    - linux_codium_extensions.rc == 0
    - item | lower not in linux_codium_extensions.stdout | lower
  changed_when: true
  tags: vscodium
- name: Install snaps
  community.general.snap:
    name: "{{ snaps }}"
  ignore_errors: true
  tags:
    - packages
    - snaps
- name: Setup powertop unit
  become: true
  ansible.builtin.template:
    src: unit.service.j2
    dest: /etc/systemd/system/powertop.service
  vars:
    description: powertop autotune
    type: oneshot
    exec_start: /usr/sbin/powertop --auto-tune
    wanted_by: multi-user.target
  tags:
    - services
    - powertop
- name: Enable systemd user services
  ansible.builtin.systemd:
    name: "{{ item }}"
    scope: user
    state: started
    enabled: true
    daemon_reload: true
  loop: "{{ units.user.enabled }}"
  ignore_errors: true
  tags:
    - services
    - systemd-user
- name: Enable systemd system services
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop: "{{ units.system.enabled }}"
  ignore_errors: true
  tags:
    - services
    - systemd-system
- name: Disable systemd system services
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    daemon_reload: true
  when: item ~ ".service" in ansible_facts.services
  loop: "{{ units.system.disabled }}"
  ignore_errors: true
  tags:
    - services
    - systemd-system
- name: Put user in groups
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups:
      - docker
      - wireshark
    append: true
  ignore_errors: true
  tags:
    - services
    - groups

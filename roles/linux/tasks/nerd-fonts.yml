---
- name: Get latest Nerd Fonts version
  ansible.builtin.uri:
    url: https://api.github.com/repos/ryanoasis/nerd-fonts/releases/latest
    return_content: true
  register: linux_nerdfonts_release
  check_mode: false # read-only request
- name: Create Nerd Fonts cache directory
  ansible.builtin.file:
    path: ~/.cache/nerdfonts
    state: directory
    mode: "0755"
- name: Create Nerd Fonts directories
  ansible.builtin.file:
    path: ~/.local/share/fonts/NerdFonts/{{ item }}
    state: directory
    mode: "0755"
  loop: "{{ nerdfonts }}"
- name: Download Nerd Fonts
  ansible.builtin.get_url:
    url: https://github.com/ryanoasis/nerd-fonts/releases/download/{{ linux_nerdfonts_release.json.tag_name }}/{{ item }}.tar.xz
    dest: ~/.cache/nerdfonts/{{ item }}-{{ linux_nerdfonts_release.json.tag_name }}.tar.xz
    mode: "0644"
  loop: "{{ nerdfonts }}"
- name: Extract Nerd Fonts
  ansible.builtin.unarchive:
    src: ~/.cache/nerdfonts/{{ item }}-{{ linux_nerdfonts_release.json.tag_name }}.tar.xz
    dest: ~/.local/share/fonts/NerdFonts/{{ item }}
    remote_src: true
    mode: u=rwX,go=rX
  loop: "{{ nerdfonts }}"
  notify: Rebuild font cache

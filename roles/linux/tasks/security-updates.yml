---
- name: Install dnf security auto updates
  ansible.builtin.package:
    name: dnf-automatic
    state: present
- name: Configure dnf security auto update
  community.general.ini_file:
    path: /etc/dnf/automatic.conf
    section: commands
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    mode: "0644"
  loop: "{{ {'upgrade_type': 'security', 'apply_updates': 'yes'} | dict2items }}"
- name: Enable dnf automatic timer # no restart needed
  ansible.builtin.systemd:
    name: dnf5-automatic.timer
    state: started
    enabled: true

name: CI
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: dnf install -y ansible-core python3-pip git && pip install ansible-lint
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Ansible Lint
        run: ansible-lint
      - name: Syntax check
        run: ansible-playbook --syntax-check playbook.yml
  packages:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: dnf install -y ansible-core sudo
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Setup repositories
        run: ansible-playbook playbook.yml --tags repos
      - name: Check packages exist
        run: ansible-playbook playbook.yml --tags dnf --check
  molecule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install ansible-core molecule "molecule-plugins[docker]"
      - name: Molecule test
        run: molecule test
